[project]
name = "pyquiz"
version = "0.0.1"
description = "pyquiz - A terminal-based quiz written in Python."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
]


[dependency-groups]
dev = [
    "pytest-cov>=6.2.1",
    "pytest>=8.4.1",
]


[tool.commitizen]
name = "cz_conventional_commits"
version = "0.0.1"
tag_format = "v$version"
version_files = [
    "pyproject.toml:version",
]
